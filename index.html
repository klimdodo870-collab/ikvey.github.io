<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin Quest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>🎡 Spin Quest</h1>
        <p>Spin. Earn. Level up.</p>
      </div>
      <div class="stats">
        <div class="stat">🪙 <b id="coins">100</b></div>
        <div class="stat">⭐ Lv <b id="level">1</b></div>
        <div class="stat">🔥 <b id="streak">0</b></div>
      </div>
    </header>

    <section class="game-grid">
      <section class="panel wheel-panel">
        <div class="wheel-wrap">
          <div class="pointer">▼</div>
          <div class="wheel" id="wheel" aria-label="Spin wheel">
            <div class="labels" id="labels"></div>
            <div class="wheel-center">SPIN</div>
          </div>
        </div>

        <button id="spinButton" class="spin-button" type="button">
          SPIN — 10 🪙
        </button>

        <div id="result" class="result" aria-live="polite">Choose your fate!</div>
        <div class="xp-row">
          <span>XP</span>
          <span id="xpText">0 / 100</span>
        </div>
        <div class="xp-bar"><i id="xpBar"></i></div>
      </section>

      <aside class="panel side-panel">
        <h2>Today's Challenges</h2>

        <div class="challenge">
          <div class="challenge-title">🎯 First Spin</div>
          <div class="challenge-desc">Complete 1 spin</div>
          <div class="progress"><i id="p1"></i></div>
          <small id="t1">0 / 1</small>
        </div>

        <div class="challenge">
          <div class="challenge-title">💰 Treasure Hunter</div>
          <div class="challenge-desc">Earn 100 coins</div>
          <div class="progress"><i id="p2"></i></div>
          <small id="t2">0 / 100</small>
        </div>

        <div class="challenge">
          <div class="challenge-title">🔥 Hot Streak</div>
          <div class="challenge-desc">Spin 5 times</div>
          <div class="progress"><i id="p3"></i></div>
          <small id="t3">0 / 5</small>
        </div>

        <h2 class="history-heading">Spin History</h2>
        <div id="history" class="history"></div>
        <button id="resetButton" class="reset-button" type="button">Reset Save</button>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
